<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BibTeX to HTML Converter &amp; Viewer — Convert &amp; Display BibTeX Online</title>
  <meta name="description"
    content="Free, fast online BibTeX to HTML converter and viewer. Convert and display academic BibTeX publications as clean, searchable web pages." />
  <meta name="keywords"
    content="bibtex to html, convert bibtex to html, bibtex viewer, bibtex converter, bibtex parser, bibtex to web, academic publications viewer, latex bibtex converter, online bibtex reader, bibtex search" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="author" content="ROARS Lab" />
  <link rel="canonical" href="https://bibtex.roars.dev/" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BibTeX to HTML Converter &amp; Viewer" />
  <meta property="og:title" content="BibTeX to HTML Converter &amp; Viewer" />
  <meta property="og:description"
    content="Free, fast online BibTeX to HTML converter and viewer. Convert and display academic BibTeX publications directly into searchable web pages." />
  <meta property="og:url" content="https://bibtex.roars.dev/" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="BibTeX to HTML Converter &amp; Viewer" />
  <meta name="twitter:description"
    content="Free, fast online BibTeX to HTML converter and viewer. Convert and display academic BibTeX publications directly into searchable web pages." />

  <!-- Structured Data / JSON-LD -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BibTeX to HTML Converter & Viewer",
      "alternateName": ["BibTeX Viewer", "BibTeX to HTML", "BibTeX Parser"],
      "url": "https://bibtex.roars.dev/",
      "description": "Free online tool to convert, search, filter, and display academic BibTeX (.bib) publications as clean HTML.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "All",
      "inLanguage": "en-US",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Convert BibTeX to HTML",
        "Live publication search by title, author, venue, year, or tag",
        "Group publications by Year, Type, or Default order",
        "Filter preprints and arXiv papers",
        "One-click BibTeX citation copying"
      ],
      "creator": {
        "@type": "Organization",
        "name": "ROARS Lab",
        "url": "https://roars.dev"
      },
      "sameAs": [
        "https://github.com/dynaroars/bibtex",
        "https://roars.dev"
      ]
    }
  </script>

  <link rel="stylesheet" href="./src/org.css">
</head>

<body>
  <h1>BibTeX Viewer</h1>
  <p>Convert, search, and browse academic publications from any .bib file or URL.</p>

  <p>
    <a href="https://github.com/dynaroars/bibtex">GitHub</a> |
    <a href="https://roars.dev">ROARS Lab</a>
  </p>

  <form id="sourceForm">
    <input type="url" id="urlInput" size="50" title="URL of a BibTeX (.bib) file to load" aria-label="BibTeX file URL" />
    <button type="submit" id="loadUrlBtn">Load</button>
    <label>or upload: <input type="file" id="fileInput" accept=".bib,.bibtex" /></label>
  </form>

  <p>
    <label>Search: <input type="search" id="searchInput" size="40" placeholder="title, author, venue, year, #keyword" autocomplete="off" /></label>
    <label>Group by:
      <select id="groupSelect">
        <option value="default">Default</option>
        <option value="year">Year</option>
        <option value="type">Type</option>
      </select>
    </label>
    <label><input type="checkbox" id="excludePreprints" checked /> Hide preprints</label>
  </p>

  <p id="status" role="status"></p>
  <p id="result-count" aria-live="polite"></p>

  <main id="publications-container"></main>

  <dialog id="bibtexModal">
    <h3>BibTeX Entry</h3>
    <pre id="bibtexContent"></pre>
    <button type="button" id="copyBibtex">Copy to Clipboard</button>
    <button type="button" id="closeModal">Close</button>
  </dialog>

  <script type="module" src="./src/main.js"></script>
</body>

</html>

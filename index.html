<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BibTeX to HTML Converter &amp; Viewer — Convert &amp; Display BibTeX Online</title>
  <meta name="description"
    content="Free, fast online BibTeX to HTML converter and viewer. Convert and display academic BibTeX publications directly into clean, searchable, responsive web pages." />
  <meta name="keywords"
    content="bibtex to html, convert bibtex to html, bibtex viewer, bibtex converter, bibtex parser, bibtex to web, academic publications viewer, latex bibtex converter, online bibtex reader, bibtex search" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="author" content="ROARS Lab" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="canonical" href="https://bibtex.roars.dev/" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BibTeX to HTML Converter &amp; Viewer" />
  <meta property="og:title" content="BibTeX to HTML Converter &amp; Viewer" />
  <meta property="og:description"
    content="Free, fast online BibTeX to HTML converter and viewer. Convert and display academic BibTeX publications directly into searchable web pages." />
  <meta property="og:url" content="https://bibtex.roars.dev/" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="BibTeX to HTML Converter &amp; Viewer" />
  <meta name="twitter:description"
    content="Free, fast online BibTeX to HTML converter and viewer. Convert and display academic BibTeX publications directly into searchable web pages." />

  <!-- Structured Data / JSON-LD -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BibTeX to HTML Converter & Viewer",
      "alternateName": ["BibTeX Viewer", "BibTeX to HTML", "BibTeX Parser"],
      "url": "https://bibtex.roars.dev/",
      "description": "Free online tool to convert, search, filter, and display academic BibTeX (.bib) publications as clean, responsive HTML.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "All",
      "inLanguage": "en-US",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Convert BibTeX to HTML",
        "Live publication search by title, author, venue, year, or tag",
        "Group publications by Year, Type, or Default order",
        "Filter preprints and arXiv papers",
        "Automatic dark and light theme support",
        "One-click BibTeX citation copying"
      ],
      "creator": {
        "@type": "Organization",
        "name": "ROARS Lab",
        "url": "https://roars.dev"
      },
      "sameAs": [
        "https://github.com/dynaroars/bibtex",
        "https://roars.dev"
      ]
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <div id="app">
    <header>
      <div class="title-row">
        <h1>BibTeX Viewer</h1>
        <div class="header-actions">
          <a href="https://github.com/dynaroars/bibtex" class="icon-link" aria-label="GitHub Repository" title="GitHub" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.2c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.38.97.1-.75.4-1.27.74-1.56-2.57-.3-5.27-1.29-5.27-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18A11 11 0 0 1 12 6.14c.98 0 1.96.13 2.88.38 2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.07.79 2.16v3.21c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
            </svg>
          </a>
          <a href="https://roars.dev" class="icon-link roars-link" aria-label="ROARS Lab" title="ROARS Lab" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>
      <p class="subtitle">Convert, search, and browse academic publications from any .bib file or URL.</p>
    </header>

    <div class="source-bar">
      <span class="try-it-label">Try it:</span>
      <input type="url" id="urlInput" class="url-input" placeholder="Enter .bib URL" value="https://tvn.roars.dev/cv/cv.bib" />
      <button type="button" id="loadUrlBtn" class="btn btn-primary">Load</button>
      <label class="btn btn-secondary">
        <input type="file" id="fileInput" accept=".bib,.bibtex" />
        Upload .bib
      </label>
    </div>

    <div class="controls-card">
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="searchInput" class="search-input" placeholder="Search by title, author, venue, year, #keyword..." autocomplete="off" />
      </div>

      <div class="filter-bar">
        <div class="group-toggle" role="group" aria-label="Group publications by">
          <button type="button" class="group-btn active" data-group="default">Default</button>
          <button type="button" class="group-btn" data-group="year">Year</button>
          <button type="button" class="group-btn" data-group="type">Type</button>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" id="excludePreprints" checked />
          <span>Hide preprints</span>
        </label>
      </div>
    </div>

    <p id="result-count" class="result-count" aria-live="polite"></p>

    <main>
      <div id="publications-container" class="roster"></div>
    </main>

    <button type="button" id="back-to-top" class="back-to-top" aria-label="Back to top" title="Back to top" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
    </button>
  </div>

  <div id="bibtexModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">BibTeX Entry</h3>
        <button type="button" id="closeModal" class="close-btn" aria-label="Close modal">&times;</button>
      </div>
      <pre id="bibtexContent" class="bibtex-pre"></pre>
      <div class="modal-actions">
        <button type="button" id="copyBibtex" class="btn btn-primary">Copy to Clipboard</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
